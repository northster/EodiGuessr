<style>
/* Layout: one screen. Top strip asks the question, the map fills the rest, a bottom strip holds the actions. */
:root{
  --sea:#dbe5eb; --land:#fbfcfc; --line:#bfccd5; --border:#71858f;
  --ink:#16232b; --muted:#5a6a74; --panel:#ffffff; --panel-2:#eef2f5;
  --accent:#d7381d; --accent-soft:rgba(215,56,29,.18);
  --hit:#1d8656; --hit-soft:rgba(29,134,86,.24);
  --mid:#d9a90d; --orange:#e2711d;
  --shadow:0 6px 24px rgba(22,35,43,.14);
  --f-display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sea:#0d171d; --land:#1c2a32; --line:#344853; --border:#7b939f;
  --ink:#e7eef2; --muted:#98a9b2; --panel:#14212a; --panel-2:#1e2e38;
  --accent:#ff6748; --accent-soft:rgba(255,103,72,.24); --hit:#3cc48c; --hit-soft:rgba(60,196,140,.26);
  --mid:#e8c03c; --orange:#f08a3a;
  --shadow:0 6px 28px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --sea:#0d171d; --land:#1c2a32; --line:#344853; --border:#7b939f;
  --ink:#e7eef2; --muted:#98a9b2; --panel:#14212a; --panel-2:#1e2e38;
  --accent:#ff6748; --accent-soft:rgba(255,103,72,.24); --hit:#3cc48c; --hit-soft:rgba(60,196,140,.26);
  --mid:#e8c03c; --orange:#f08a3a;
  --shadow:0 6px 28px rgba(0,0,0,.5); color-scheme:dark}

html,body{height:100%}
body{background:var(--sea);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}
.bar{background:var(--panel);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{padding-block:10px 12px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:end}
.brand{font-family:var(--f-display);font-size:15px;letter-spacing:.02em;color:var(--muted);display:flex;gap:8px;align-items:center}
.brand b{color:var(--accent);font-weight:400}
.round{font-family:var(--f-num);font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.round.dist{font-size:15px;color:var(--ink)}
.round.dist b{font-weight:600}
.rows li.sum{border-bottom:0;font-weight:700}
.target{grid-column:1/-1;font-family:var(--f-display);font-size:clamp(28px,7vw,40px);line-height:1.05;min-height:1.05em;text-wrap:balance}
.target:empty{display:none}
.target small{font-family:var(--f-body);font-weight:700;font-size:.5em;color:var(--muted);margin-right:.35em;vertical-align:.18em}
.target .of{font-family:var(--f-num);font-size:.45em;color:var(--muted);margin-left:.3em}
.pips{grid-column:1/-1;display:flex;gap:4px;margin-top:4px}
.pip{flex:1;height:4px;border-radius:2px;background:var(--panel-2)}
.pip.now{background:var(--muted)}

.mapwrap{position:relative;flex:1;min-height:0}
svg{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none}
.sgg{fill:var(--land);stroke:var(--line);stroke-width:.7px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.bare .sgg{stroke:var(--land)}
.sgg.ans{stroke-width:1.6px}
.pin{stroke:var(--panel);vector-effect:non-scaling-stroke;stroke-width:2px;fill:var(--ink)}
.link{stroke-width:1.1px;stroke-opacity:.5;stroke-linecap:round;vector-effect:non-scaling-stroke;fill:none;stroke:var(--ink)}
.link.dash{stroke-opacity:1;stroke-width:1.6px;stroke-dasharray:4 4}
.lbl{font-family:var(--f-body);font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-linejoin:round;text-anchor:middle;dominant-baseline:central;pointer-events:none}

.zoom{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 18px var(--f-num);box-shadow:var(--shadow);cursor:pointer}
.hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--panel);color:var(--muted);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:13px;white-space:nowrap;box-shadow:var(--shadow);pointer-events:none;transition:opacity .3s}

.bottom{padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);min-height:68px;display:flex;align-items:center}
.row{display:flex;gap:12px;align-items:center;flex:1;min-width:0}
.row.even .btn{flex:1;padding-inline:10px}
.verdict{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.verdict .pts{font-family:var(--f-num);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums}
.verdict .sub{font-size:13px;color:var(--muted)}
.btn{appearance:none;border:0;border-radius:12px;padding:13px 22px;font:700 16px var(--f-body);cursor:pointer;background:var(--ink);color:var(--panel);transition:transform .08s,opacity .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.3;cursor:default}
.btn.alt{background:var(--panel-2);color:var(--ink)}
.btn.accent{background:var(--accent);color:#fff}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.overlay{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--sea) 55%,transparent);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto;z-index:5}
.card{background:var(--panel);border-radius:18px;box-shadow:var(--shadow);width:min(420px,100%);padding:24px;display:flex;flex-direction:column;gap:16px}
.card h1{font-family:var(--f-display);font-weight:400;font-size:44px;line-height:1;margin:0}
.card h1 b{color:var(--accent);font-weight:400}
.card h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0}
.card p{margin:0;color:var(--muted);line-height:1.6}
.modes{display:flex;flex-direction:column;gap:8px}
.mode{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:12px 14px;cursor:pointer;font:inherit}
.mode:hover{border-color:var(--border)}
.mode strong{font-size:16px}
.mode span{grid-column:1;font-size:13px;color:var(--muted)}
.mode em{grid-row:1/3;grid-column:2;font-style:normal;font-family:var(--f-num);font-size:12px;color:var(--muted)}
.mode.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.mode.primary span,.mode.primary em{color:color-mix(in srgb,var(--panel) 70%,transparent)}
.foot{font-size:11px;color:var(--muted);line-height:1.5}
.foot a{color:inherit}

.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.rows li{display:grid;grid-template-columns:1fr auto 3.2em;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:center}
.rows .km{font-family:var(--f-num);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rows .p{font-family:var(--f-num);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.rows .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows .nm small{color:var(--muted);margin-right:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1}
.shot{width:100%;max-height:58vh;object-fit:contain;border-radius:10px;background:var(--panel-2)}
.toast{font-size:13px;color:var(--hit);min-height:1.2em;margin-top:-8px;white-space:pre-line}
.side{display:none}
@media (min-width: 900px){
  /* PC: the map fills the left, a 380px column on the right holds the question, the round list and the actions */
  .app{display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto minmax(0,1fr) auto;
    grid-template-areas:"map top" "map side" "map bottom"}
  .top{grid-area:top;border-bottom:0;border-left:1px solid var(--line);padding-block:24px 16px;padding-inline:28px}
  .mapwrap{grid-area:map}
  .bottom{grid-area:bottom;border-top:1px solid var(--line);border-left:1px solid var(--line);padding-inline:28px;padding-block:18px}
  .side{display:flex;flex-direction:column;gap:12px;grid-area:side;background:var(--panel);border-left:1px solid var(--line);padding:4px 28px 16px;overflow:auto;min-height:0}
  .side h3{margin:8px 0 0;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
  .side .empty{color:var(--muted);font-size:14px;line-height:1.6}
  .top{grid-template-columns:1fr;gap:6px}
  .brand{font-size:18px;white-space:nowrap}
  .round{text-align:left}
  .target{font-size:44px}
  .round{font-size:14px}
  .round.dist{font-size:16px}
  #openList{display:none}
  .row.even .btn{padding-inline:8px;font-size:15px}
  .zoom{right:16px;bottom:16px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="bar top">
    <div class="brand"><span>Eodi<b>Guessr</b></span><span id="modeName"></span></div>
    <div class="round" id="round"></div>
    <div class="target" id="target" aria-live="polite"></div>
    <div class="pips" id="pips"></div>
  </header>
  <main class="mapwrap" id="mapwrap">
    <svg id="map" role="img" aria-label="대한민국 시군구 지도"></svg>
    <div class="hint" id="hint" hidden>지도를 눌러 위치를 찍으세요 · 두 손가락으로 확대</div>
    <div class="zoom">
      <button id="zin" aria-label="확대">+</button>
      <button id="zout" aria-label="축소">−</button>
      <button id="zfit" aria-label="전체 보기">⌂</button>
    </div>
    <div class="overlay" id="startOv">
      <div class="card">
        <h1>Eodi<b>Guessr</b></h1>
        <p>지역 이름이 나오면 지도에서 그 위치를 찍으세요. 5문제를 풀면 거리에 따라 0~100점이 나옵니다.</p>
        <div class="modes" id="modes"></div>
        <div class="foot">경계: 통계청 SGIS 행정동 경계(공공누리 제1유형)를 <a href="https://github.com/vuski/admdongkor" target="_blank" rel="noopener">vuski/admdongkor</a>가 가공한 2026년 10월 기준 자료(CC BY 4.0). 일반구는 시 단위로 합쳤습니다.</div>
      </div>
    </div>
    <div class="overlay" id="listOv" hidden>
      <div class="card">
        <h2>문제별 점수</h2>
        <ul class="rows" id="rows"></ul>
        <div class="actions"><button class="btn alt" id="listClose">지도로 돌아가기</button></div>
      </div>
    </div>
    <div class="overlay" id="shareOv" hidden>
      <div class="card">
        <img class="shot" id="shot" alt="결과 지도 이미지">
        <div class="actions">
          <button class="btn accent" id="shareImg">공유하기</button>
          <button class="btn alt" id="saveImg">이미지 저장</button>
          <button class="btn alt" id="copyText">텍스트 복사</button>
        </div>
        <div class="toast" id="toast"></div>
        <div class="actions"><button class="btn alt" id="shareClose">닫기</button></div>
      </div>
    </div>
  </main>
  <section class="side" aria-label="문제별 결과">
    <h3>문제별 결과</h3>
    <ul class="rows" id="sideRows"></ul>
    <p class="empty" id="sideEmpty">문제를 풀면 여기에 지역별 거리와 점수가 쌓입니다.</p>
  </section>
  <footer class="bar bottom">
    <div class="row" id="playRow">
      <div class="verdict" id="verdict"><span class="sub">시작할 모드를 고르세요</span></div>
      <button class="btn" id="action" disabled>확정</button>
    </div>
    <div class="row even" id="endRow" hidden>
      <button class="btn alt" id="openList">목록</button>
      <button class="btn accent" id="openShare">결과 공유</button>
      <button class="btn" id="home">메인으로</button>
    </div>
  </footer>
</div>

const ROUNDS = 5;
const K_KM = 45; // score falloff: 100 * e^(-d / K_KM)

const features = topojson.feature(TOPO, TOPO.objects.sgg).features;
features.forEach((f, i) => { f.id = i; });
const nameCount = d3.rollup(features, v => v.length, f => f.properties.name);
const label = f => f.properties.sido === "세종" ? { pre: "", name: "세종시" }
  : { pre: nameCount.get(f.properties.name) > 1 ? f.properties.sido : "", name: f.properties.name };
// Color by miss distance: green when the score is 80+ (about 10km or closer),
// then yellow → orange → red on a log scale from 10km to 150km.
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const missT = r => Math.max(0, Math.min(1, Math.log(Math.max(r.km, 10) / 10) / Math.log(15)));
function heat(r) {
  if (r.score >= 80) return css("--hit");
  return d3.interpolateRgbBasis([css("--mid"), css("--orange"), css("--accent")])(missT(r));
}
const soft = (c, a = 0.26) => { const x = d3.color(c); x.opacity = a; return x.formatRgb(); };
const emoji = r => r.score >= 80 ? "🟩" : missT(r) < 0.34 ? "🟨" : missT(r) < 0.67 ? "🟧" : "🟥";
const fmtKm = km => km === 0 ? "정답" : (km < 10 ? km.toFixed(1) : Math.round(km)) + "km";

// Names used in more than one 시도 (중구, 동구, 고성군 …) are never asked.

  { id: "hard", name: "어려움", desc: `시군구 경계선 없이 전국 ${ROUNDS}곳`, pool: () => askable, hard: true },
  { id: "metro", name: "수도권", desc: "서울 · 인천 · 경기만", pool: () => askable.filter(f => metroArea.includes(f)), area: metroArea },
];

const bodyFont = getComputedStyle(document.documentElement).getPropertyValue("--f-body");
const numFont = getComputedStyle(document.documentElement).getPropertyValue("--f-num");

// items: {x, y, w} in pixels; pins: {x, y, r}. Returns a center per item, avoiding pins and earlier labels.
const mctx = document.createElement("canvas").getContext("2d");
function measure(name, fs) { mctx.font = `700 ${fs}px ${bodyFont}`; return mctx.measureText(name).width; }
function placeLabels(items, pins, fs) {
  const h = fs * 1.35, boxes = pins.map(p => ({ x0: p.x - p.r, y0: p.y - p.r, x1: p.x + p.r, y1: p.y + p.r }));
  const ov = (a, b) => Math.max(0, Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0)) * Math.max(0, Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0));
  return items.map(it => {
    const sx = it.w / 2 + fs * 0.6;
    const cands = [[0, 0], [0, -h], [0, h], [sx, 0], [-sx, 0], [sx, -h], [-sx, -h], [sx, h], [-sx, h], [0, -2 * h], [0, 2 * h], [sx, -2 * h], [-sx, 2 * h]];
    let best = null, bs = Infinity;
    for (const [dx, dy] of cands) {
      const x = it.x + dx, y = it.y + dy;
      const b = { x0: x - it.w / 2 - 3, x1: x + it.w / 2 + 3, y0: y - h / 2, y1: y + h / 2 };
      let s = Math.hypot(dx, dy) * 0.02;
      for (const o of boxes) s += ov(b, o);
      if (s < bs) { bs = s; best = { x, y, b }; }
    }
    boxes.push(best.b);
    return best;
  });
}

// ---------- map ----------
const svg = d3.select("#map");
const wrap = document.getElementById("mapwrap");
const proj = d3.geoMercator();
const path = d3.geoPath(proj);
const gZoom = svg.append("g");
const gLand = gZoom.append("g");
const gMarks = gZoom.append("g");
let W = 0, H = 0, curK = 1, viewFeatures = features;

const regionSel = gLand.selectAll("path.sgg").data(features).join("path").attr("class", "sgg");

const zoom = d3.zoom().scaleExtent([1, 40]).on("zoom", e => {
  gZoom.attr("transform", e.transform);
  curK = e.transform.k;
  drawMarks();

svg.call(zoom).on("dblclick.zoom", null);

function layout() {
  W = wrap.clientWidth; H = wrap.clientHeight;
  svg.attr("viewBox", [0, 0, W, H]);
  const pad = Math.min(W, H) * 0.05;
  proj.fitExtent([[pad, pad], [W - pad, H - pad]], { type: "FeatureCollection", features: viewFeatures });
  const vis = new Set(viewFeatures);
  regionSel.attr("d", path).attr("display", d => vis.has(d) ? null : "none");
  zoom.translateExtent([[-W * .5, -H * .5], [W * 1.5, H * 1.5]]);
  drawMarks();
}
const dur = () => matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 650;
document.getElementById("zin").onclick = () => svg.transition().duration(250).call(zoom.scaleBy, 1.8);
document.getElementById("zout").onclick = () => svg.transition().duration(250).call(zoom.scaleBy, 1 / 1.8);
document.getElementById("zfit").onclick = () => phase === "done" ? fitResults() : svg.transition().duration(dur()).call(zoom.transform, d3.zoomIdentity);

function zoomToBox([[x0, y0], [x1, y1]], fill = 0.62) {
  const bw = Math.max(x1 - x0, 20), bh = Math.max(y1 - y0, 20);
  const k = Math.max(1, Math.min(12, fill / Math.max(bw / W, bh / H)));
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  svg.transition().duration(dur()).call(zoom.transform, d3.zoomIdentity.translate(W / 2, H / 2).scale(k).translate(-cx, -cy));
}
function boundsOf(rs) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const r of rs) {
    const b = path.bounds(r.f), g = proj(r.guess);
    x0 = Math.min(x0, b[0][0], g[0]); y0 = Math.min(y0, b[0][1], g[1]);
    x1 = Math.max(x1, b[1][0], g[0]); y1 = Math.max(y1, b[1][1], g[1]);
  }
  return [[x0, y0], [x1, y1]];
}
const fitResults = () => zoomToBox(boundsOf(results), 0.8);

// ---------- geometry: distance from a point to a region (km) ----------
function nearest(feature, [lon, lat]) {
  if (d3.geoContains(feature, [lon, lat])) return { km: 0, pt: [lon, lat] };
  const cx = Math.cos(lat * Math.PI / 180) * 111.32, cy = 110.57;
  let best = Infinity, bp = null;
  const g = feature.geometry;
  const polys = g.type === "Polygon" ? [g.coordinates] : g.coordinates;
  for (const poly of polys) for (const ring of poly) for (let i = 1; i < ring.length; i++) {
    const ax = (ring[i - 1][0] - lon) * cx, ay = (ring[i - 1][1] - lat) * cy;
    const bx = (ring[i][0] - lon) * cx, by = (ring[i][1] - lat) * cy;
    const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy;
    const t = L ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / L)) : 0;
    const px = ax + t * dx, py = ay + t * dy, d = Math.hypot(px, py);
    if (d < best) { best = d; bp = [lon + px / cx, lat + py / cy]; }
  }
  return { km: best, pt: bp };
}
const scoreFor = km => km < 0.5 ? 100 : Math.round(100 * Math.exp(-km / K_KM));

// ---------- game state ----------
let phase = "idle", mode = null, queue = [], idx = 0, results = [], guess = null, revealed = false;

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
function pick(pool, n, rand) {
  const a = pool.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a.slice(0, n);
}
const total = () => Math.round(results.reduce((s, r) => s + r.score, 0) / ROUNDS);
const sumKm = () => results.reduce((s, r) => s + r.km, 0);
const fmtSum = () => Math.round(sumKm()).toLocaleString("ko-KR") + "km";

const $ = id => document.getElementById(id);
const action = $("action");

const dailyKey = () => "eodiguessr-daily-" + today();
function loadDaily() { try { return JSON.parse(localStorage.getItem(dailyKey())); } catch (e) { return null; } }
function saveDaily() {
  if (!mode || !mode.daily) return;
  try { localStorage.setItem(dailyKey(), JSON.stringify({ n: ROUNDS, rs: results.map(r => ({ id: r.f.id, g: r.guess })) })); } catch (e) {}
}
function renderModes() {
  $("modes").innerHTML = "";
  for (const m of MODES) {
    const b = document.createElement("button");
    b.className = "mode" + (m.primary ? " primary" : "");
    let desc = m.desc, tag = m.daily ? today().slice(5).replace("-", ".") : m.pool().length + "곳";
    const d = m.daily && loadDaily();
    if (d && d.rs.length >= ROUNDS) { desc = "오늘은 완료했어요 · 결과 보기"; tag = "완료"; }
    else if (d && d.rs.length) { desc = `이어서 풀기 (${d.rs.length}/${ROUNDS})`; }
    b.innerHTML = `<strong>${m.name}</strong><span>${desc}</span><em>${tag}</em>`;
    b.onclick = () => start(m);
    $("modes").append(b);
  }
}

function paintRegions() {
  const shown = new Map();
  if (phase === "done") results.forEach(r => shown.set(r.f, heat(r)));
  else if (revealed) shown.set(results[idx].f, heat(results[idx]));
  regionSel.attr("class", d => "sgg" + (shown.has(d) ? " ans" : ""))
    .style("fill", d => shown.has(d) ? soft(shown.get(d)) : null)
    .style("stroke", d => shown.has(d) ? shown.get(d) : null);
  regionSel.filter(d => shown.has(d)).raise();
  svg.classed("bare", phase === "done" || (phase === "play" && mode && mode.hard));
}

function start(m) {
  mode = m; phase = "play";
  const seed = m.daily ? Number(today().replaceAll("-", "")) : (Math.random() * 2 ** 31) | 0;
  queue = pick(m.pool(), ROUNDS, rng(seed));
  idx = 0; results = [];
  // the daily set can be played once: restore what was already answered today
  const saved = m.daily && loadDaily();
  if (saved && saved.n === ROUNDS) {
    saved.rs.forEach((s, i) => {
      if (!queue[i] || queue[i].id !== s.id) return;
      const { km, pt } = nearest(queue[i], s.g);
      results.push({ f: queue[i], km, pt, guess: s.g, score: scoreFor(km) });
    });
    idx = Math.min(results.length, ROUNDS - 1);
  }
  $("startOv").hidden = true; $("listOv").hidden = true; $("shareOv").hidden = true;
  $("playRow").hidden = false; $("endRow").hidden = true;
  $("modeName").textContent = "· " + m.name;
  $("round").className = "round";
  viewFeatures = m.area || features;
  svg.interrupt().call(zoom.transform, d3.zoomIdentity);
  layout();
  if (results.length >= ROUNDS) finish(); else nextRound();
}

function nextRound() {
  guess = null; revealed = false;
  paintRegions(); drawMarks();
  const l = label(queue[idx]);
  $("target").innerHTML = (l.pre ? `<small>${l.pre}</small>` : "") + l.name;
  $("round").textContent = `${idx + 1} / ${ROUNDS}`;
  $("hint").hidden = !(idx === 0 && !results.length); // only before the first tap of a game
  renderPips();
  $("verdict").innerHTML = `<span class="sub">지도를 눌러 위치를 찍으세요</span>`;
  action.textContent = "확정"; action.className = "btn"; action.disabled = true;
  if (curK > 1.01 && idx > 0) svg.transition().duration(dur()).call(zoom.transform, d3.zoomIdentity);
}

function renderPips() {
  $("pips").innerHTML = "";
  for (let i = 0; i < ROUNDS; i++) {
    const p = document.createElement("div"), r = results[i];
    p.className = "pip" + (!r && phase === "play" && i === idx ? " now" : "");
    if (r) p.style.background = heat(r);
    $("pips").append(p);
  }
  renderRows();
}

svg.on("click", e => {
  if (phase !== "play" || revealed) return;
  const ll = proj.invert(d3.pointer(e, gZoom.node()));
  if (!ll) return;
  guess = ll;
  $("hint").hidden = true;
  drawMarks();
  action.disabled = false;
  $("verdict").innerHTML = `<span class="sub">위치를 옮기려면 다시 누르세요</span>`;
});

// Draws pins, lines and labels for whatever is visible now. Sizes are divided by zoom so they stay constant on screen.
function drawMarks() {
  gMarks.selectAll("*").remove();
  const k = curK, t = d3.zoomTransform(svg.node());
  const shown = phase === "done" ? results : (phase === "play" && revealed ? [results[idx]] : []);
  const dash = phase === "play" ? " dash" : "";
  for (const r of shown) {
    if (r.km > 0) gMarks.append("path").attr("class", "link" + dash).style("stroke", heat(r)).attr("d", `M${proj(r.guess)}L${proj(r.pt)}`);
  }
  // A dot marks each tap. The answer's name sits on the answer region, nudged off dots and other names.
  const pins = shown.map(r => ({ c: heat(r), p: proj(r.guess) }));
  if (phase === "play" && !revealed && guess) pins.push({ c: null, p: proj(guess) });
  for (const { c, p } of pins) {
    gMarks.append("circle").attr("class", "pin").style("fill", c).attr("cx", p[0]).attr("cy", p[1]).attr("r", (W >= 700 ? 7 : 6) / k);
  }
  if (!shown.length) return;
  const fs = W >= 700 ? 15 : 13;
  const items = shown.map(r => { const [x, y] = t.apply(path.centroid(r.f)); return { x, y, w: measure(label(r.f).name, fs) }; });
  const spots = placeLabels(items, pins.map(({ p }) => { const [x, y] = t.apply(p); return { x, y, r: 8 }; }), fs);
  shown.forEach((r, i) => {
    const [x, y] = t.invert([spots[i].x, spots[i].y]);
    gMarks.append("text").attr("class", "lbl").attr("x", x).attr("y", y)
      .attr("font-size", fs / k).attr("stroke-width", 4 / k).text(label(r.f).name);
  });
}

function reveal() {
  const f = queue[idx];
  const { km, pt } = nearest(f, guess);
  const score = scoreFor(km);
  results[idx] = { f, km, pt, guess, score };
  revealed = true;
  saveDaily();
  paintRegions(); drawMarks();
  zoomToBox(boundsOf([results[idx]]));
  $("verdict").innerHTML = `<span class="pts">+${score}점</span><span class="sub">${km === 0 ? "정확히 안쪽입니다" : `경계까지 ${fmtKm(km)} 떨어졌습니다`}</span>`;
  renderPips();
  const last = idx === ROUNDS - 1;
  action.textContent = last ? "결과 보기" : "다음 지역";
  action.className = "btn accent";
}

function finish() {
  phase = "done";
  $("hint").hidden = true;
  const tt = total();
  $("target").innerHTML = `${tt}<span class="of">/ 100</span>`;
  $("round").innerHTML = `총 오차 <b>${fmtSum()}</b>`; $("round").className = "round dist";
  $("playRow").hidden = true; $("endRow").hidden = false;
  renderPips(); paintRegions(); drawMarks(); fitResults();
}

function renderRows() {
  const rs = results.filter(Boolean);
  const html = rs.map(r => {
    const l = label(r.f);
    return `<li><span class="nm">${l.pre ? `<small>${l.pre}</small>` : ""}${l.name}</span><span class="km">${fmtKm(r.km)}</span><span class="p" style="color:${heat(r)}">${r.score}</span></li>`;
  }).join("") + (phase === "done" ? `<li class="sum"><span class="nm">합계</span><span class="km">${fmtSum()}</span><span class="p">${total()}</span></li>` : "");
  $("rows").innerHTML = html; $("sideRows").innerHTML = html;
  $("sideEmpty").hidden = rs.length > 0;
}

action.onclick = () => {
  if (phase !== "play") return;
  if (!revealed) { if (guess) reveal(); return; }
  if (idx === ROUNDS - 1) { finish(); return; }
  idx++; nextRound();
};
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && phase === "play" && !action.disabled && document.activeElement === document.body) { e.preventDefault(); action.click(); } });

$("openList").onclick = () => { $("listOv").hidden = false; };
$("listClose").onclick = () => { $("listOv").hidden = true; };
$("home").onclick = goHome;
$("shareClose").onclick = () => { $("shareOv").hidden = true; };

// ---------- share image ----------
let shotBlob = null;
const shareText = () => `EodiGuessr · ${mode.name}${mode.daily ? " " + today() : ""}\n${total()}/100 · 총 오차 ${fmtSum()}\n` +
  results.map(emoji).join("") + (location.protocol.startsWith("http") ? "\n" + location.href.split(/[?#]/)[0].replace(/index\.html$/, "") : "");

async function makeImage() {
  try { await document.fonts.ready; } catch (e) {}
  const CW = 1080, CH = 1350, c = document.createElement("canvas");
  c.width = CW; c.height = CH;
  const ctx = c.getContext("2d");
  const col = { panel: css("--panel"), ink: css("--ink"), muted: css("--muted"), sea: css("--sea"), land: css("--land"), line: css("--line"), accent: css("--accent") };
  const disp = css("--f-display");
  ctx.fillStyle = col.panel; ctx.fillRect(0, 0, CW, CH);

  // header
  ctx.textBaseline = "alphabetic";
  ctx.font = `48px ${disp}`; ctx.fillStyle = col.ink; ctx.fillText("Eodi", 60, 100);
  const w1 = ctx.measureText("Eodi").width; ctx.fillStyle = col.accent; ctx.fillText("Guessr", 60 + w1, 100);
  ctx.font = `500 28px ${numFont}`; ctx.fillStyle = col.muted; ctx.textAlign = "right";
  ctx.fillText(mode.name + (mode.daily ? " · " + today() : ""), CW - 60, 98);
  ctx.textAlign = "left";
  const tt = total();
  ctx.font = `600 132px ${numFont}`; ctx.fillStyle = col.ink; ctx.fillText(String(tt), 52, 250);
  const w2 = ctx.measureText(String(tt)).width;
  ctx.font = `500 40px ${numFont}`; ctx.fillStyle = col.muted; ctx.fillText("/ 100", 52 + w2 + 14, 250);
  ctx.textAlign = "right";
  ctx.font = `600 44px ${numFont}`; ctx.fillStyle = col.ink; ctx.fillText(fmtSum(), CW - 60, 250);
  const w3 = ctx.measureText(fmtSum()).width;
  ctx.font = `700 28px ${bodyFont}`; ctx.fillStyle = col.muted; ctx.fillText("총 오차", CW - 60 - w3 - 14, 248);
  ctx.textAlign = "left";

  // map
  const mx = 40, my = 290, mw = CW - 80, mh = 900;
  ctx.save();
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(mx, my, mw, mh, 28) : ctx.rect(mx, my, mw, mh); ctx.clip();
  ctx.fillStyle = col.sea; ctx.fillRect(mx, my, mw, mh);
  const target = { type: "FeatureCollection", features: [...results.map(r => r.f), { type: "Feature", geometry: { type: "MultiPoint", coordinates: results.map(r => r.guess) } }] };
  const p = d3.geoMercator().fitExtent([[mx + 70, my + 70], [mx + mw - 70, my + mh - 70]], target);
  const gp = d3.geoPath(p, ctx);
  ctx.beginPath(); viewFeatures.forEach(f => gp(f)); ctx.fillStyle = col.land; ctx.fill();
  for (const r of results) {
    const c = heat(r);
    ctx.beginPath(); gp(r.f); ctx.fillStyle = soft(c); ctx.fill(); ctx.strokeStyle = c; ctx.lineWidth = 3; ctx.stroke();
  }
  ctx.lineWidth = 2.4; ctx.lineCap = "round"; ctx.globalAlpha = 0.5;
  for (const r of results) if (r.km > 0) {
    const a = p(r.guess), b = p(r.pt);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.strokeStyle = heat(r); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  const pins = results.map(r => { const [x, y] = p(r.guess); return { x, y, r: 14 }; });
  ctx.lineJoin = "round";
  results.forEach((r, i) => {
    ctx.beginPath(); ctx.arc(pins[i].x, pins[i].y, 10, 0, Math.PI * 2);
    ctx.fillStyle = heat(r); ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = col.panel; ctx.stroke();
  });
  const fs = 30;
  const items = results.map(r => { const [x, y] = gp.centroid(r.f); return { x, y, w: measure(label(r.f).name, fs) }; });
  const spots = placeLabels(items, pins, fs);
  ctx.textBaseline = "middle"; ctx.textAlign = "center";
  results.forEach((r, i) => {
    const x0 = spots[i].x, y = spots[i].y, name = label(r.f).name;
    ctx.lineWidth = 9; ctx.strokeStyle = col.land;
    ctx.font = `700 ${fs}px ${bodyFont}`; ctx.strokeText(name, x0, y); ctx.fillStyle = col.ink; ctx.fillText(name, x0, y);
  });
  ctx.textAlign = "left";
  ctx.restore();

  // footer: one square per round, then the address
  ctx.textBaseline = "middle";
  results.forEach((r, i) => {
    ctx.fillStyle = heat(r);
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(60 + i * 52, 1242, 42, 42, 8) : ctx.rect(60 + i * 52, 1242, 42, 42); ctx.fill();
  });
  if (location.protocol.startsWith("http")) {
    ctx.font = `500 26px ${numFont}`; ctx.fillStyle = col.muted; ctx.textAlign = "right";
    ctx.fillText(location.host + location.pathname.replace(/index\.html$/, ""), CW - 60, 1263); ctx.textAlign = "left";
  }
  return new Promise(res => c.toBlob(res, "image/png"));
}

$("openShare").onclick = async () => {
  $("toast").textContent = "";
  shotBlob = await makeImage();
  const img = $("shot");
  if (img.src) URL.revokeObjectURL(img.src);
  img.src = URL.createObjectURL(shotBlob);
  const file = new File([shotBlob], "eodiguessr.png", { type: "image/png" });
  $("shareImg").hidden = !(navigator.canShare && navigator.canShare({ files: [file] }));
  $("shareOv").hidden = false;
};
$("shareImg").onclick = async () => {
  try { await navigator.share({ files: [new File([shotBlob], "eodiguessr.png", { type: "image/png" })], text: shareText() }); }
  catch (e) { if (e.name !== "AbortError") $("toast").textContent = "공유하지 못했습니다. 이미지를 길게 눌러 저장해 주세요."; }
};
$("saveImg").onclick = () => {
  const a = document.createElement("a");
  a.href = $("shot").src; a.download = `eodiguessr-${today()}.png`;
  document.body.append(a); a.click(); a.remove();
  $("toast").textContent = "저장이 안 되면 이미지를 길게 누르거나 우클릭해서 저장하세요.";
};
$("copyText").onclick = () => {
  const text = shareText();
  try { navigator.clipboard.writeText(text).then(() => { $("toast").textContent = "결과 텍스트를 복사했습니다."; }, () => { $("toast").textContent = text; }); }
  catch (e) { $("toast").textContent = text; }
};

function resetTop() {
  $("target").innerHTML = "";
  $("round").textContent = `${ROUNDS}문제`; $("round").className = "round";
  $("modeName").textContent = "";
  renderPips();
  $("verdict").innerHTML = `<span class="sub">시작할 모드를 고르세요</span>`;
  action.textContent = "확정"; action.className = "btn"; action.disabled = true;
}
function goHome() {
  phase = "idle"; mode = null; results = []; queue = []; idx = 0; guess = null; revealed = false;
  ["listOv", "shareOv", "endRow"].forEach(id => { $(id).hidden = true; });
  $("playRow").hidden = false; $("startOv").hidden = false;
  viewFeatures = features;
  svg.interrupt().call(zoom.transform, d3.zoomIdentity);
  layout(); paintRegions(); resetTop(); renderModes();
}

new ResizeObserver(layout).observe(wrap);
// the miss colors are computed from theme tokens, so repaint when the theme flips
const repaint = () => { paintRegions(); renderPips(); drawMarks(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", repaint);
new MutationObserver(repaint).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
layout(); renderModes(); resetTop();
</script>

</body>
